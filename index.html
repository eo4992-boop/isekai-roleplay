<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#17181c">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>창작물 빙의 시뮬레이션 (창·빙·시)</title>
  <link rel="stylesheet" href="style.css">
  <!-- 마크다운 렌더러 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>
  <div id="app-container">
    <!-- 상단 헤더 -->
    <header>
      <div style="display: flex; align-items: center; gap: 8px;">
        <button id="btn-drawer" class="btn-icon" title="대화 목록">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="3" y1="12" x2="21" y2="12"></line>
            <line x1="3" y1="6" x2="21" y2="6"></line>
            <line x1="3" y1="18" x2="21" y2="18"></line>
          </svg>
        </button>
        <div class="header-title-wrap">
          <div class="header-title">
            <span>창·빙·시</span>
            <span class="badge" id="model-badge">flash-lite</span>
            <span class="badge" id="version-badge" style="background: rgba(212,175,55,0.15); color: var(--current-accent); font-size: 10px; margin-left: 4px; padding: 2px 6px; border-radius: 4px; border: 1px solid var(--current-accent);">v1.3 세션</span>
          </div>
          <div class="header-sub">창작물 빙의 시뮬레이션</div>
        </div>
      </div>
      <div class="header-actions">
        <button id="btn-reload" class="btn-icon" title="앱 새로고침">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="23 4 23 10 17 10"></polyline>
            <polyline points="1 20 1 14 7 14"></polyline>
            <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
          </svg>
        </button>
        <button id="btn-new-chat" class="btn-icon" title="새 시뮬레이션 시작 (+)">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
        </button>
        <button id="btn-settings" class="btn-icon" title="설정">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </header>

    <!-- 11대 특수 명령어 칩 가로 스크롤 바 -->
    <div id="quick-command-bar">
      <button class="cmd-chip" data-cmd="세이브">💾 세이브</button>
      <button class="cmd-chip" data-cmd="인벤토리">🎒 인벤토리</button>
      <button class="cmd-chip" data-cmd="퀘스트">📜 퀘스트</button>
      <button class="cmd-chip" data-cmd="프로필">📛 프로필</button>
      <button class="cmd-chip" data-cmd="마갤모드">💻 마갤모드</button>
      <button class="cmd-chip" data-cmd="대사모드">🗣️ 대사모드</button>
      <button class="cmd-chip" data-cmd="관찰모드">👀 관찰모드</button>
      <button class="cmd-chip" data-cmd="선택지모드">💠 선택지모드</button>
      <button class="cmd-chip" data-cmd="설정모드">⚙️ 설정모드</button>
    </div>

    <!-- 채팅 메시지 목록 -->
    <main id="chat-messages"></main>

    <!-- 하단 입력 바 -->
    <footer>
      <div class="input-container">
        <textarea id="chat-input" placeholder="메시지를 입력하세요 (예: 나루토, 1, 행동 등)..." rows="1"></textarea>
        <button id="btn-send" class="btn-send" title="전송">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="22" y1="2" x2="11" y2="13"></line>
            <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
          </svg>
        </button>
      </div>
    </footer>

    <!-- 설정 모달 -->
    <div id="settings-modal" class="modal-overlay">
      <div class="modal-content">
        <div class="modal-header">
          <div class="modal-title">⚙️ 시뮬레이션 환경 설정</div>
          <button id="btn-close-modal" class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <div class="form-group">
          <label class="form-label" for="input-api-key">Gemini API 키 (무료)</label>
          <input type="password" id="input-api-key" class="form-input" placeholder="AIzaSy...">
          <span style="font-size: 11px; color: var(--text-sub);">
            API 키가 없으신가요? <a href="https://aistudio.google.com/app/apikey" target="_blank" style="color: var(--current-accent);">Google AI Studio</a>에서 1초 만에 무료 발급 가능합니다. (내 브라우저에만 안전하게 저장됨)
          </span>
        </div>

        <div class="form-group">
          <label class="form-label" for="select-model">AI 모델 선택</label>
          <select id="select-model" class="form-select">
            <option value="gemini-flash-lite-latest" selected>Gemini Flash Lite (넉넉한 쿼터 · 서버 상시 안정 · 강력 추천)</option>
            <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash Lite (초고속 경량형)</option>
            <option value="gemini-3.5-flash">Gemini 3.5 Flash (일일 20회 제한 모델)</option>
          </select>
        </div>

        <div class="form-group">
          <label class="form-label" for="select-theme">상태창 테마 스타일</label>
          <select id="select-theme" class="form-select">
            <option value="gold">골드 (기본 · Ritual)</option>
            <option value="mono">모노 글로우 (Cyber Glow)</option>
            <option value="emerald">에메랄드 (Dashboard)</option>
            <option value="royal">황혼 (Twilight Glass)</option>
            <option value="crimson">크림슨 (Diamond Red)</option>
            <option value="widget">시스템 글래스 (HUD Widget)</option>
          </select>
        </div>

        <button id="btn-save-settings" class="btn-primary">설정 저장 및 시작</button>
        <button id="btn-force-reload" class="btn-secondary" style="width: 100%; margin-top: 10px; font-size: 13px; padding: 10px; background: #252830; border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; cursor: pointer;">🔄 최신 버전으로 새로고침 (업데이트)</button>
      </div>
    </div>

    <!-- 대화 기록 사이드바 드로어 (Drawer) -->
    <div id="drawer-overlay" class="drawer-overlay"></div>
    <div id="drawer-content" class="drawer-content">
      <div class="drawer-header">
        <div class="drawer-title">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
            <polyline points="14 2 14 8 20 8"></polyline>
            <line x1="16" y1="13" x2="8" y2="13"></line>
            <line x1="16" y1="17" x2="8" y2="17"></line>
            <polyline points="10 9 9 9 8 9"></polyline>
          </svg>
          <span>시뮬레이션 기록</span>
        </div>
        <button id="btn-close-drawer" class="btn-icon" title="닫기">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <button id="btn-drawer-new" class="drawer-new-btn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>+ 새로운 시뮬레이션 시작</span>
      </button>

      <div id="session-list" class="session-list">
        <!-- 자바스크립트로 세션 목록 동적 렌더링 -->
      </div>
    </div>
  </div>

  <script src="app.js?v=1.3"></script>
</body>
</html>
